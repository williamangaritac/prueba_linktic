version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: linktic_postgres
    environment:
      POSTGRES_DB: linktic_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - linktic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Products Service (Spring Boot Application)
  products-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linktic_products_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linktic_products
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linktic_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  linktic_network:
    driver: bridge

