<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <!-- Modal Container -->
  <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <!-- Modal Header -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-4 rounded-t-lg">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Crear Nuevo Producto</h2>
        <button
          type="button"
          (click)="onClose()"
          class="text-white hover:text-gray-200 transition-colors"
          [disabled]="isSubmitting"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Modal Body -->
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="p-6">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
        <div class="flex items-center">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      </div>

      <!-- SKU Field -->
      <div class="mb-4">
        <label for="sku" class="block text-sm font-medium text-gray-700 mb-2">
          SKU <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="sku"
          formControlName="sku"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="hasError('sku')"
          placeholder="Ej: PROD001"
        />
        <p *ngIf="hasError('sku')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('sku') }}
        </p>
      </div>

      <!-- Name Field -->
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="hasError('name')"
          placeholder="Ej: Laptop Dell Inspiron"
        />
        <p *ngIf="hasError('name')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('name') }}
        </p>
      </div>

      <!-- Description Field -->
      <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
          Descripción
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          [class.border-red-500]="hasError('description')"
          placeholder="Descripción del producto..."
        ></textarea>
        <p *ngIf="hasError('description')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('description') }}
        </p>
      </div>

      <!-- Price Field -->
      <div class="mb-4">
        <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
          Precio <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <span class="absolute left-3 top-2 text-gray-500">$</span>
          <input
            type="number"
            id="price"
            formControlName="price"
            step="0.01"
            min="0.01"
            class="w-full pl-8 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [class.border-red-500]="hasError('price')"
            placeholder="0.00"
          />
        </div>
        <p *ngIf="hasError('price')" class="mt-1 text-sm text-red-600">
          {{ getErrorMessage('price') }}
        </p>
      </div>

      <!-- Status Field -->
      <div class="mb-6">
        <label class="flex items-center cursor-pointer">
          <input
            type="checkbox"
            formControlName="status"
            class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
          />
          <span class="ml-2 text-sm font-medium text-gray-700">Producto Activo</span>
        </label>
        <p class="mt-1 text-sm text-gray-500">
          Los productos activos se mostrarán en el catálogo
        </p>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end space-x-3 pt-4 border-t">
        <button
          type="button"
          (click)="onClose()"
          [disabled]="isSubmitting"
          class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center"
        >
          <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSubmitting ? 'Creando...' : 'Crear Producto' }}
        </button>
      </div>
    </form>
  </div>
</div>
