<div
  *ngIf="isOpen && product"
  (click)="onBackdropClick($event)"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">

  <div class="bg-white rounded-lg max-w-md w-full shadow-2xl">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-4 rounded-t-lg">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Comprar Producto</h2>
        <button
          (click)="onClose()"
          [disabled]="isProcessing"
          class="text-white hover:text-gray-200 text-2xl font-bold disabled:opacity-50">
          &times;
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      <!-- Product Info -->
      <div class="mb-6">
        <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ product.name }}</h3>
        <p class="text-sm text-gray-600 mb-3">SKU: {{ product.sku }}</p>
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-700 font-medium">Precio unitario:</span>
          <span class="text-2xl font-bold text-blue-600">{{ formattedUnitPrice }}</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-700 font-medium">Stock disponible:</span>
          <span class="text-lg font-semibold" [ngClass]="maxQuantity > 0 ? 'text-green-600' : 'text-red-600'">
            {{ maxQuantity }} unidades
          </span>
        </div>
      </div>

      <!-- Out of Stock Warning -->
      <div *ngIf="maxQuantity === 0" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 font-medium text-center">
          ⚠️ Producto sin stock disponible
        </p>
      </div>

      <!-- Quantity Selector -->
      <div *ngIf="maxQuantity > 0" class="mb-6">
        <label class="block text-gray-700 font-medium mb-3">Cantidad:</label>
        <div class="flex items-center justify-center gap-4">
          <button
            (click)="decreaseQuantity()"
            [disabled]="quantity <= 1 || isProcessing"
            class="w-12 h-12 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            -
          </button>
          <input
            type="number"
            [(ngModel)]="quantity"
            (ngModelChange)="onQuantityChange()"
            [min]="1"
            [max]="maxQuantity"
            [disabled]="isProcessing"
            class="w-24 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none disabled:opacity-50">
          <button
            (click)="increaseQuantity()"
            [disabled]="quantity >= maxQuantity || isProcessing"
            class="w-12 h-12 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            +
          </button>
        </div>
        <p class="text-sm text-gray-500 text-center mt-2">
          Máximo: {{ maxQuantity }} unidades
        </p>
      </div>

      <!-- Total Price -->
      <div *ngIf="maxQuantity > 0" class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
        <div class="flex justify-between items-center">
          <span class="text-lg font-semibold text-gray-700">Total a pagar:</span>
          <span class="text-3xl font-bold text-blue-600">{{ formattedTotalPrice }}</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3">
        <button
          (click)="onClose()"
          [disabled]="isProcessing"
          class="flex-1 px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
        <button
          (click)="onConfirmPurchase()"
          [disabled]="isPurchaseDisabled"
          class="flex-1 px-6 py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg hover:shadow-xl">
          <span *ngIf="!isProcessing">💳 Pagar Ya</span>
          <span *ngIf="isProcessing" class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
