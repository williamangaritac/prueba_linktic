<div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
  <!-- Product Image -->
  <img
    [src]="productImage"
    [alt]="product.name"
    class="w-full h-48 object-cover">

  <div class="p-6">
    <!-- Product Name and Status -->
    <div class="flex justify-between items-start mb-2">
      <h3 class="text-xl font-semibold text-gray-900 flex-1">{{ product.name }}</h3>
      <span
        class="ml-2 px-2 py-1 text-xs font-semibold rounded-full"
        [ngClass]="statusBadgeClass">
        {{ statusText }}
      </span>
    </div>

    <!-- Product Description -->
    <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ product.description }}</p>

    <!-- Product Info -->
    <div class="mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-2xl font-bold text-blue-600">{{ formattedPrice }}</span>
        <span
          class="text-sm font-semibold"
          [ngClass]="stockBadgeClass">
          Stock: {{ product.stock || 0 }}
        </span>
      </div>
      <div class="text-xs text-gray-500">
        <p>SKU: {{ product.sku }}</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2">
      <button
        (click)="onViewDetails()"
        class="flex-1 bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 transition-colors text-sm font-medium">
        Ver Detalles
      </button>
      <button
        (click)="onPurchase()"
        [disabled]="!product.status || isOutOfStock"
        class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors text-sm font-medium disabled:bg-gray-400 disabled:cursor-not-allowed">
        {{ isOutOfStock ? 'Sin Stock' : 'Comprar' }}
      </button>
    </div>
  </div>
</div>
