<section id="catalogo" class="py-12">
  <div class="container mx-auto px-6">
    <!-- Header with Title and Create Button -->
    <div class="flex justify-between items-center mb-12">
      <h2 class="text-4xl font-bold text-gray-900">
        Nuestro Catálogo de Soluciones
      </h2>
      <button
        (click)="openCreateProductModal()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition-all duration-300 flex items-center space-x-2"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Crear Producto</span>
      </button>
    </div>

    <!-- Loading Indicator -->
    <div *ngIf="loading" class="text-center py-8">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Cargando productos...</p>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!loading">
      <!-- Info -->
      <div class="text-center mb-6 text-gray-600">
        <p>Mostrando {{ products.length }} productos de {{ totalElements }} totales</p>
        <p class="text-sm">Página {{ currentPageForPagination }} de {{ totalPagesForPagination }}</p>
      </div>

      <!-- Paginación Superior -->
      <app-pagination
        [totalItems]="totalElements"
        [itemsPerPage]="6"
        [currentPage]="currentPageForPagination"
        (pageChange)="onPageChange($event)">
      </app-pagination>

      <!-- Grid de Productos -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8">
        <app-product-card
          *ngFor="let product of products"
          [product]="product"
          (viewDetails)="onViewDetails($event)"
          (purchase)="onPurchase($event)">
        </app-product-card>
      </div>

      <!-- Empty State -->
      <div *ngIf="products.length === 0" class="text-center py-12">
        <p class="text-gray-600 text-lg">No hay productos disponibles</p>
      </div>

      <!-- Paginación Inferior -->
      <app-pagination
        [totalItems]="totalElements"
        [itemsPerPage]="6"
        [currentPage]="currentPageForPagination"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</section>

<!-- Modal de Detalles -->
<app-product-modal
  [product]="selectedProduct"
  [isOpen]="isModalOpen"
  (close)="onCloseModal()">
</app-product-modal>

<!-- Modal de Compra -->
<app-purchase-modal
  [product]="productToPurchase"
  [isOpen]="isPurchaseModalOpen"
  (close)="onClosePurchaseModal()"
  (confirmPurchase)="onConfirmPurchase($event)">
</app-purchase-modal>

<!-- Modal de Crear Producto -->
<app-create-product-modal
  *ngIf="isCreateProductModalOpen"
  (close)="closeCreateProductModal()"
  (productCreated)="onProductCreated()">
</app-create-product-modal>
